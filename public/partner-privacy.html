<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Политика обработки ПД — Bloknot</title>
    <link rel="icon" href="/favicon.png?v=2" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; line-height: 1.7; }
        header { background: #fff; border-bottom: 1px solid #eee; }
        .header-inner { max-width: 860px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
        .logo img { height: 32px; }
        .back-link { color: #007bff; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        .container { max-width: 860px; margin: 0 auto; padding: 30px 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 32px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .meta { color: #666; font-size: 13px; margin-bottom: 24px; }
        .content { white-space: pre-wrap; font-size: 15px; }
        .error { color: #b71c1c; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="logo"><a href="/"><img src="/logo-wordmark.svg?v=10" alt="Bloknot"></a></div>
            <a href="/work-in-bloknot.html" class="back-link">← К анкете</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h1>Политика обработки персональных данных</h1>
            <div class="meta" id="meta">Загрузка...</div>
            <div class="content" id="content">Загрузка...</div>
        </div>
    </div>

    <script>
        async function load() {
            const params = new URLSearchParams(window.location.search);
            const version = params.get('version');
            const url = version ? '/api/partners/privacy/' + encodeURIComponent(version) : '/api/partners/contract';

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Не удалось загрузить');
                const data = await res.json();
                const p = data.privacy || data;
                document.getElementById('meta').textContent = 'Версия ' + p.version + ' · Хэш ' + p.hash.slice(0, 16) + '...';
                document.getElementById('content').textContent = p.content;
                document.title = 'Политика ПД v' + p.version + ' — Bloknot';
            } catch (e) {
                document.getElementById('content').className = 'content error';
                document.getElementById('content').textContent = 'Ошибка загрузки политики.';
            }
        }
        load();
    </script>
</body>
</html>
